<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - JobConnect</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container" style="max-width:420px;">
    <div class="card">
        <h2>Log in</h2>

        <div class="alert error" th:if="${errorMessage}" th:text="${errorMessage}"></div>
        <div class="alert success" th:if="${param.registered}">Account created — please log in.</div>
        <div class="alert success" th:if="${param.logout}">You have been logged out.</div>

        <form th:action="@{/login}" th:object="${loginRequest}" method="post">
            <div class="field">
                <label>Email</label>
                <input type="email" th:field="*{email}" placeholder="jane@example.com"/>
            </div>
            <div class="field">
                <label>Password</label>
                <input type="password" th:field="*{password}" placeholder="Password"/>
            </div>
            <button class="btn" type="submit">Log In</button>
        </form>
        <p class="muted">No account yet? <a th:href="@{/register}">Register</a></p>
    </div>
</div>
</body>
</html>
