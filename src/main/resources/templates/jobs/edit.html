<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Job - JobConnect</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container" style="max-width:560px;">
    <div class="card">
        <h2>Edit Job</h2>
        <form th:action="@{'/jobs/edit/' + ${jobId}}" th:object="${jobRequest}" method="post">
            <div class="field">
                <label>Title</label>
                <input type="text" th:field="*{title}" placeholder="Backend Engineer"/>
                <div class="error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
            </div>
            <div class="field">
                <label>Description</label>
                <textarea th:field="*{description}" placeholder="Responsibilities, requirements, etc."></textarea>
                <div class="error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
            </div>
            <div class="field">
                <label>Location</label>
                <input type="text" th:field="*{location}" placeholder="Bangalore, India"/>
                <div class="error" th:if="${#fields.hasErrors('location')}" th:errors="*{location}"></div>
            </div>
            <div class="field">
                <label>Salary (annual, numeric)</label>
                <input type="number" step="0.01" th:field="*{salary}"/>
                <div class="error" th:if="${#fields.hasErrors('salary')}" th:errors="*{salary}"></div>
            </div>
            <div class="field">
                <label>Application Deadline</label>
                <input type="date" th:field="*{deadline}"/>
                <div class="error" th:if="${#fields.hasErrors('deadline')}" th:errors="*{deadline}"></div>
            </div>
            <button class="btn" type="submit">Save Changes</button>
        </form>
    </div>
</div>
</body>
</html>
