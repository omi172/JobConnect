<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register - JobConnect</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container" style="max-width:480px;">
    <div class="card">
        <h2>Create your account</h2>

        <div class="alert error" th:if="${errorMessage}" th:text="${errorMessage}"></div>

        <form th:action="@{/register}" th:object="${registerRequest}" method="post">
            <div class="field">
                <label>Full Name</label>
                <input type="text" th:field="*{fullName}" placeholder="Jane Doe"/>
                <div class="error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
            </div>
            <div class="field">
                <label>Email</label>
                <input type="email" th:field="*{email}" placeholder="jane@example.com"/>
                <div class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>
            <div class="field">
                <label>Password</label>
                <input type="password" th:field="*{password}" placeholder="At least 6 characters"/>
                <div class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
            </div>
            <div class="field">
                <label>Phone Number (for SMS notifications, E.164 format e.g. +15551234567)</label>
                <input type="text" th:field="*{phoneNumber}" placeholder="+15551234567"/>
            </div>
            <div class="field">
                <label>I am a...</label>
                <select th:field="*{role}">
                    <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"></option>
                </select>
            </div>
            <div class="field">
                <label>Company Name (employers only)</label>
                <input type="text" th:field="*{companyName}" placeholder="Acme Inc."/>
            </div>
            <button class="btn" type="submit">Register</button>
        </form>
        <p class="muted">Already have an account? <a th:href="@{/login}">Log in</a></p>
    </div>
</div>
</body>
</html>
